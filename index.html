<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Terminal Talos - Laptop Interface</title>
    <link rel="stylesheet" href="remember.css" />
  </head>
  <body>
    <div class="scene-container">
      <div class="laptop-screen">
        <div class="terminal-content">
          <div id="imagen-container" class="imagen-container">
            <img
              id="imagen"
              src="/images/image.png"
            />
          </div>
          <div id="output"></div>
          <div class="input-line">
            <span class="prompt">&gt;</span>
            <input type="text" id="terminal-input" autofocus />
          </div>
        </div>
      </div>
      <div id="audio"></div>
      <div class="terminal-options" id="options-container">
        <!-- Las opciones se generarán dinámicamente -->
      </div>
    </div>

    <div id="reboot-overlay">
      <div class="reboot-content">
        <div class="spinner"></div>
        <p>Rebooting...</p>
      </div>
    </div>

    <div id="tv-effect-overlay" class="overlay">
      <a href="https://drive.google.com/drive/u/0/folders/1Bv9FcVAoQICb-gEdwSXc5VkKTD9xigqn" id="golden-orb" class="orb"></a>
    </div>

    <div id="stars-overlay">
      <div class="star-container">
        <p class="secret">loviu</p>
      </div>
    </div>

     <div class="celebracion-container" id="celebration-container">
        <h1 class="win-text">YOU WIN</h1>
        </div>

    <script src="thinking.js"></script>
  </body>
</html>
